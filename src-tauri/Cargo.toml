[package]
name = "cli-companion"
version = "0.20.0"
description = "CLI companion con terminali integrati Windows + WSL"
authors = ["necos98"]
edition = "2021"

[lib]
name = "cli_companion_lib"
# Solo rlib: staticlib/cdylib servono ai target mobile (non usati) e
# allungano la build (con LTO il cdylib viene linkato a parte).
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
portable-pty = "0.9"
quick-xml = "0.42"
base64 = "0.22"
# Nome del file degli allegati dell'HUB nell'header della richiesta raw (gia' nel grafo, via url).
percent-encoding = "2.3"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
log = "0.4"
tauri-plugin-log = "2"
ts-rs = { version = "12", features = ["serde-compat", "no-serde-warnings"] }
keyring = { version = "4.2", default-features = false, features = ["v1"] }
# Client dei segretari dell'Agents HUB verso un endpoint compatibile OpenAI (solo la
# chat). reqwest e' la stessa 0.13 dell'updater: serve per il timeout del client.
async-openai = { version = "0.43", default-features = false, features = ["rustls-no-provider", "chat-completion"] }
reqwest = { version = "0.13", default-features = false }
# Sleep/timeout/canali dei supervisori dei connettori e il listener loopback del consenso
# OAuth di Gmail (gia' nel grafo via tauri e reqwest).
tokio = { version = "1", default-features = false, features = ["time", "sync", "macros", "net", "io-util"] }
# SHA-256 della sfida PKCE del consenso OAuth (gia' nel grafo).
sha2 = "0.10"
# Provider crittografico di rustls: `ring`, come l'updater (niente aws-lc, che compila C).
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
windows-sys = { version = "0.59", features = ["Win32_System_Power"] }

[profile.release]
# LTO "thin" e codegen-units di default (16): build molto piu' veloce
# a fronte di un binario leggermente piu' grande.
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
