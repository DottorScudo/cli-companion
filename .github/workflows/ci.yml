name: ci

# Controlli di qualita' su ogni push a main e su ogni pull request:
# formattazione, lint, tipi e test di frontend (npm) e backend (cargo).
# Non produce eseguibili ne' Release (vedi build-windows.yml).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        # shared-key diversa da quella di release: qui si compila in profilo dev.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend deps
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Test (node)
        run: npm test

      - name: Format check (rustfmt)
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (cargo)
        working-directory: src-tauri
        run: cargo test
